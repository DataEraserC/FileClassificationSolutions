<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件分类系统</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>文件分类系统</h1>
        </header>

        <div class="main-container">
            <!-- 侧边栏 -->
            <aside class="sidebar">
                <nav>
                    <ul>
                        <li><a href="#files" class="nav-link" data-target="files">文件管理</a></li>
                        <li><a href="#groups" class="nav-link" data-target="groups">组管理</a></li>
                        <li><a href="#tags" class="nav-link" data-target="tags">标签管理</a></li>
                        <li><a href="#file-groups" class="nav-link" data-target="file-groups">文件组关联</a></li>
                        <li><a href="#group-tags" class="nav-link" data-target="group-tags">组标签关联</a></li>
                        <li><a href="#group-relations" class="nav-link" data-target="group-relations">组关系管理</a></li>
                    </ul>
                </nav>
            </aside>

            <!-- 主内容区 -->
            <main class="content">
                <!-- 文件管理 -->
                <section id="files" class="tab-content">
                    <h2>文件管理</h2>
                    <div class="toolbar">
                        <button onclick="openCreateFileDialog()">新增文件</button>
                        <button onclick="openBatchDeleteFileDialog()">批量删除</button>
                        <button onclick="openComplexSearchFileDialog()">复杂查询</button>
                    </div>
                    <div class="table-container">
                        <table id="files-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>类型</th>
                                    <th>路径</th>
                                    <th>引用计数</th>
                                    <th>组ID</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- 数据将通过JavaScript动态填充 -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- 组管理 -->
                <section id="groups" class="tab-content" style="display: none;">
                    <h2>组管理</h2>
                    <div class="toolbar">
                        <button onclick="openCreateGroupDialog()">新增组</button>
                        <button onclick="openBatchDeleteGroupDialog()">批量删除</button>
                        <button onclick="openComplexSearchGroupDialog()">复杂查询</button>
                    </div>
                    <div class="table-container">
                        <table id="groups-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>名称</th>
                                    <th>描述</th>
                                    <th>引用计数</th>
                                    <th>父组ID</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- 数据将通过JavaScript动态填充 -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- 标签管理 -->
                <section id="tags" class="tab-content" style="display: none;">
                    <h2>标签管理</h2>
                    <div class="toolbar">
                        <button onclick="openCreateTagDialog()">新增标签</button>
                        <button onclick="openBatchDeleteTagDialog()">批量删除</button>
                        <button onclick="openComplexSearchTagDialog()">复杂查询</button>
                    </div>
                    <div class="table-container">
                        <table id="tags-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>名称</th>
                                    <th>描述</th>
                                    <th>引用计数</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- 数据将通过JavaScript动态填充 -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- 文件组关联 -->
                <section id="file-groups" class="tab-content" style="display: none;">
                    <h2>文件组关联</h2>
                    <div class="toolbar">
                        <button onclick="openCreateFileGroupDialog()">新增关联</button>
                        <button onclick="openBatchDeleteFileGroupDialog()">批量删除</button>
                        <button onclick="openComplexSearchFileGroupDialog()">复杂查询</button>
                    </div>
                    <div class="table-container">
                        <table id="file-groups-table">
                            <thead>
                                <tr>
                                    <th>文件ID</th>
                                    <th>组ID</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- 数据将通过JavaScript动态填充 -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- 组标签关联 -->
                <section id="group-tags" class="tab-content" style="display: none;">
                    <h2>组标签关联</h2>
                    <div class="toolbar">
                        <button onclick="openCreateGroupTagDialog()">新增关联</button>
                        <button onclick="openBatchDeleteGroupTagDialog()">批量删除</button>
                        <button onclick="openComplexSearchGroupTagDialog()">复杂查询</button>
                    </div>
                    <div class="table-container">
                        <table id="group-tags-table">
                            <thead>
                                <tr>
                                    <th>组ID</th>
                                    <th>标签ID</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- 数据将通过JavaScript动态填充 -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- 组关系管理 -->
                <section id="group-relations" class="tab-content" style="display: none;">
                    <h2>组关系管理</h2>
                    <div class="toolbar">
                        <button onclick="openCreateGroupRelationDialog()">新增关系</button>
                        <button onclick="openBatchDeleteGroupRelationDialog()">批量删除</button>
                        <button onclick="openComplexSearchGroupRelationDialog()">复杂查询</button>
                    </div>
                    <div class="table-container">
                        <table id="group-relations-table">
                            <thead>
                                <tr>
                                    <th>第一组ID</th>
                                    <th>第二组ID</th>
                                    <th>关系类型</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- 数据将通过JavaScript动态填充 -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- 弹窗模态框 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modal-body">
                <!-- 弹窗内容将通过JavaScript动态填充 -->
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        // Tab切换功能
        document.addEventListener('DOMContentLoaded', function() {
            const navLinks = document.querySelectorAll('.nav-link');
            const tabContents = document.querySelectorAll('.tab-content');
            
            // 存储已打开的标签页
            const openedTabs = new Set();
            
            navLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    
                    const target = this.getAttribute('data-target');
                    
                    // 添加到已打开标签页集合
                    openedTabs.add(target);
                    
                    // 隐藏所有tab内容
                    tabContents.forEach(content => {
                        content.style.display = 'none';
                    });
                    
                    // 移除所有链接的活动状态
                    navLinks.forEach(nav => {
                        nav.classList.remove('active');
                    });
                    
                    // 显示当前tab内容
                    document.getElementById(target).style.display = 'block';
                    
                    // 设置当前链接为活动状态
                    this.classList.add('active');
                });
            });
            
            // 默认显示第一个tab
            if (tabContents.length > 0) {
                tabContents[0].style.display = 'block';
                navLinks[0].classList.add('active');
                openedTabs.add(navLinks[0].getAttribute('data-target'));
            }
        });
    </script>
</body>
</html>
