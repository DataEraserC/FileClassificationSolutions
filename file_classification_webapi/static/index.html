<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件分类系统</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>文件分类系统</h1>
        </header>

        <div class="main-container">
            <!-- 侧边栏 -->
            <aside class="sidebar">
                <nav>
                    <ul>
                        <li><a href="#files" class="nav-link" data-target="files">文件管理</a></li>
                        <li><a href="#groups" class="nav-link" data-target="groups">组管理</a></li>
                        <li><a href="#tags" class="nav-link" data-target="tags">标签管理</a></li>
                        <li><a href="#file-groups" class="nav-link" data-target="file-groups">文件组关联</a></li>
                        <li><a href="#group-tags" class="nav-link" data-target="group-tags">组标签关联</a></li>
                        <li><a href="#group-relations" class="nav-link" data-target="group-relations">组关系管理</a></li>
                    </ul>
                </nav>
            </aside>

            <!-- 主内容区 -->
            <main class="content">
                <!-- 文件管理 -->
                <section id="files" class="tab-content">
                    <h2>文件管理</h2>
                    <!-- 简单搜索表单 -->
                    <div class="search-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="file-id">文件ID:</label>
                                <input type="number" id="file-id" placeholder="请输入文件ID">
                            </div>
                            <div class="form-group">
                                <label for="file-type">文件类型:</label>
                                <input type="text" id="file-type" placeholder="请输入文件类型">
                            </div>
                            <div class="form-group">
                                <label for="file-path">文件路径:</label>
                                <input type="text" id="file-path" placeholder="请输入文件路径">
                            </div>
                            <div class="form-group">
                                <button onclick="listFilesByFilter()">搜索</button>
                                <button onclick="resetFileFilter()">重置</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="toolbar">
                        <button onclick="openCreateFileDialog()">新增文件</button>
                        <button onclick="deleteSelectedFiles()">批量删除</button>
                        <button onclick="openComplexSearchFileDialog()">复杂查询</button>
                    </div>
                    <div class="table-container">
                        <table id="files-table">
                            <thead>
                                <tr>
                                    <th><input type="checkbox" id="files-select-all" onclick="toggleAllFiles(this)"></th>
                                    <th>ID</th>
                                    <th>类型</th>
                                    <th>路径</th>
                                    <th>引用计数</th>
                                    <th>组ID</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- 数据将通过JavaScript动态填充 -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- 组管理 -->
                <section id="groups" class="tab-content" style="display: none;">
                    <h2>组管理</h2>
                    <!-- 简单搜索表单 -->
                    <div class="search-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="group-id">组ID:</label>
                                <input type="number" id="group-id" placeholder="请输入组ID">
                            </div>
                            <div class="form-group">
                                <label for="group-name">组名:</label>
                                <input type="text" id="group-name" placeholder="请输入组名">
                            </div>
                            <div class="form-group">
                                <button onclick="listGroupsByFilter()">搜索</button>
                                <button onclick="resetGroupFilter()">重置</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="toolbar">
                        <button onclick="openCreateGroupDialog()">新增组</button>
                        <button onclick="deleteSelectedGroups()">批量删除</button>
                        <button onclick="openComplexSearchGroupDialog()">复杂查询</button>
                    </div>
                    <div class="table-container">
                        <table id="groups-table">
                            <thead>
                                <tr>
                                    <th><input type="checkbox" id="groups-select-all" onclick="toggleAllGroups(this)"></th>
                                    <th>ID</th>
                                    <th>名称</th>
                                    <th>描述</th>
                                    <th>引用计数</th>
                                    <th>父组ID</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- 数据将通过JavaScript动态填充 -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- 标签管理 -->
                <section id="tags" class="tab-content" style="display: none;">
                    <h2>标签管理</h2>
                    <!-- 简单搜索表单 -->
                    <div class="search-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="tag-id">标签ID:</label>
                                <input type="number" id="tag-id" placeholder="请输入标签ID">
                            </div>
                            <div class="form-group">
                                <label for="tag-name">标签名:</label>
                                <input type="text" id="tag-name" placeholder="请输入标签名">
                            </div>
                            <div class="form-group">
                                <button onclick="listTagsByFilter()">搜索</button>
                                <button onclick="resetTagFilter()">重置</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="toolbar">
                        <button onclick="openCreateTagDialog()">新增标签</button>
                        <button onclick="deleteSelectedTags()">批量删除</button>
                        <button onclick="openComplexSearchTagDialog()">复杂查询</button>
                    </div>
                    <div class="table-container">
                        <table id="tags-table">
                            <thead>
                                <tr>
                                    <th><input type="checkbox" id="tags-select-all" onclick="toggleAllTags(this)"></th>
                                    <th>ID</th>
                                    <th>名称</th>
                                    <th>描述</th>
                                    <th>引用计数</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- 数据将通过JavaScript动态填充 -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- 文件组关联 -->
                <section id="file-groups" class="tab-content" style="display: none;">
                    <h2>文件组关联</h2>
                    <!-- 简单搜索表单 -->
                    <div class="search-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="file-group-file-id">文件ID:</label>
                                <input type="number" id="file-group-file-id" placeholder="请输入文件ID">
                            </div>
                            <div class="form-group">
                                <label for="file-group-group-id">组ID:</label>
                                <input type="number" id="file-group-group-id" placeholder="请输入组ID">
                            </div>
                            <div class="form-group">
                                <button onclick="listFileGroupsByFilter()">搜索</button>
                                <button onclick="resetFileGroupFilter()">重置</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="toolbar">
                        <button onclick="openCreateFileGroupDialog()">新增关联</button>
                        <button onclick="deleteSelectedFileGroups()">批量删除</button>
                        <button onclick="openComplexSearchFileGroupDialog()">复杂查询</button>
                    </div>
                    <div class="table-container">
                        <table id="file-groups-table">
                            <thead>
                                <tr>
                                    <th><input type="checkbox" id="file-groups-select-all" onclick="toggleAllFileGroups(this)"></th>
                                    <th>文件ID</th>
                                    <th>组ID</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- 数据将通过JavaScript动态填充 -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- 组标签关联 -->
                <section id="group-tags" class="tab-content" style="display: none;">
                    <h2>组标签关联</h2>
                    <!-- 简单搜索表单 -->
                    <div class="search-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="group-tag-group-id">组ID:</label>
                                <input type="number" id="group-tag-group-id" placeholder="请输入组ID">
                            </div>
                            <div class="form-group">
                                <label for="group-tag-tag-id">标签ID:</label>
                                <input type="number" id="group-tag-tag-id" placeholder="请输入标签ID">
                            </div>
                            <div class="form-group">
                                <button onclick="listGroupTagsByFilter()">搜索</button>
                                <button onclick="resetGroupTagFilter()">重置</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="toolbar">
                        <button onclick="openCreateGroupTagDialog()">新增关联</button>
                        <button onclick="deleteSelectedGroupTags()">批量删除</button>
                        <button onclick="openComplexSearchGroupTagDialog()">复杂查询</button>
                    </div>
                    <div class="table-container">
                        <table id="group-tags-table">
                            <thead>
                                <tr>
                                    <th><input type="checkbox" id="group-tags-select-all" onclick="toggleAllGroupTags(this)"></th>
                                    <th>组ID</th>
                                    <th>标签ID</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- 数据将通过JavaScript动态填充 -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- 组关系管理 -->
                <section id="group-relations" class="tab-content" style="display: none;">
                    <h2>组关系管理</h2>
                    <!-- 简单搜索表单 -->
                    <div class="search-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="group-relation-first-id">第一组ID:</label>
                                <input type="number" id="group-relation-first-id" placeholder="请输入第一组ID">
                            </div>
                            <div class="form-group">
                                <label for="group-relation-second-id">第二组ID:</label>
                                <input type="number" id="group-relation-second-id" placeholder="请输入第二组ID">
                            </div>
                            <div class="form-group">
                                <label for="group-relation-type">关系类型:</label>
                                <input type="text" id="group-relation-type" placeholder="请输入关系类型">
                            </div>
                            <div class="form-group">
                                <button onclick="listGroupRelationsByFilter()">搜索</button>
                                <button onclick="resetGroupRelationFilter()">重置</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="toolbar">
                        <button onclick="openCreateGroupRelationDialog()">新增关系</button>
                        <button onclick="deleteSelectedGroupRelations()">批量删除</button>
                        <button onclick="openComplexSearchGroupRelationDialog()">复杂查询</button>
                    </div>
                    <div class="table-container">
                        <table id="group-relations-table">
                            <thead>
                                <tr>
                                    <th><input type="checkbox" id="group-relations-select-all" onclick="toggleAllGroupRelations(this)"></th>
                                    <th>第一组ID</th>
                                    <th>第二组ID</th>
                                    <th>关系类型</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- 数据将通过JavaScript动态填充 -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- 弹窗模态框 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modal-body">
                <!-- 弹窗内容将通过JavaScript动态填充 -->
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        // Tab切换功能
        document.addEventListener('DOMContentLoaded', function() {
            const navLinks = document.querySelectorAll('.nav-link');
            const tabContents = document.querySelectorAll('.tab-content');
            
            // 存储已打开的标签页
            const openedTabs = new Set();
            
            navLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    
                    const target = this.getAttribute('data-target');
                    
                    // 添加到已打开标签页集合
                    openedTabs.add(target);
                    
                    // 隐藏所有tab内容
                    tabContents.forEach(content => {
                        content.style.display = 'none';
                    });
                    
                    // 移除所有链接的活动状态
                    navLinks.forEach(nav => {
                        nav.classList.remove('active');
                    });
                    
                    // 显示当前tab内容
                    document.getElementById(target).style.display = 'block';
                    
                    // 设置当前链接为活动状态
                    this.classList.add('active');
                    
                    // 页面刚打开时自动搜索一次
                    autoSearch(target);
                });
            });
            
            // 默认显示第一个tab并自动搜索
            if (tabContents.length > 0) {
                tabContents[0].style.display = 'block';
                navLinks[0].classList.add('active');
                openedTabs.add(navLinks[0].getAttribute('data-target'));
                
                // 自动执行首次搜索
                autoSearch(navLinks[0].getAttribute('data-target'));
            }
        });
        
        // 根据当前tab自动执行搜索
        function autoSearch(tabName) {
            switch(tabName) {
                case 'files':
                    listFilesByFilter();
                    break;
                case 'groups':
                    listGroupsByFilter();
                    break;
                case 'tags':
                    listTagsByFilter();
                    break;
                case 'file-groups':
                    listFileGroupsByFilter();
                    break;
                case 'group-tags':
                    listGroupTagsByFilter();
                    break;
                case 'group-relations':
                    listGroupRelationsByFilter();
                    break;
            }
        }
        
        // 重置文件搜索表单
        function resetFileFilter() {
            document.getElementById('file-id').value = '';
            document.getElementById('file-type').value = '';
            document.getElementById('file-path').value = '';
            listFilesByFilter(); // 重置后重新搜索
        }
        
        // 重置组搜索表单
        function resetGroupFilter() {
            document.getElementById('group-id').value = '';
            document.getElementById('group-name').value = '';
            listGroupsByFilter(); // 重置后重新搜索
        }
        
        // 重置标签搜索表单
        function resetTagFilter() {
            document.getElementById('tag-id').value = '';
            document.getElementById('tag-name').value = '';
            listTagsByFilter(); // 重置后重新搜索
        }
        
        // 重置文件组关联搜索表单
        function resetFileGroupFilter() {
            document.getElementById('file-group-file-id').value = '';
            document.getElementById('file-group-group-id').value = '';
            listFileGroupsByFilter(); // 重置后重新搜索
        }
        
        // 重置组标签关联搜索表单
        function resetGroupTagFilter() {
            document.getElementById('group-tag-group-id').value = '';
            document.getElementById('group-tag-tag-id').value = '';
            listGroupTagsByFilter(); // 重置后重新搜索
        }
        
        // 重置组关系搜索表单
        function resetGroupRelationFilter() {
            document.getElementById('group-relation-first-id').value = '';
            document.getElementById('group-relation-second-id').value = '';
            document.getElementById('group-relation-type').value = '';
            listGroupRelationsByFilter(); // 重置后重新搜索
        }
    </script>
</body>
</html>
