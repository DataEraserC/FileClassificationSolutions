<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>文件分类系统</title>
    <link href="favicon.ico" rel="icon" type="image/x-icon">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <div id="header-placeholder"></div>

    <div class="main-container">
        <div id="sidebar-placeholder"></div>

        <!-- 主内容区 -->
        <main class="content">
            <div id="home-placeholder"></div>
            <div id="files-placeholder"></div>
            <div id="groups-placeholder"></div>
            <div id="tags-placeholder"></div>
            <div id="file-groups-placeholder"></div>
            <div id="group-tags-placeholder"></div>
            <div id="group-relations-placeholder"></div>
        </main>
    </div>
</div>

<!-- 移动端底部导航栏 -->
<nav class="mobile-navbar">
    <ul>
        <li><a class="nav-link active" data-target="home" href="#home">
            <span class="nav-icon">🏠</span>
            <span class="nav-text">主页</span>
        </a></li>
        <li><a class="nav-link" data-target="files" href="#files">
            <span class="nav-icon">📁</span>
            <span class="nav-text">文件</span>
        </a></li>
        <li><a class="nav-link" data-target="groups" href="#groups">
            <span class="nav-icon">📂</span>
            <span class="nav-text">组</span>
        </a></li>
        <li><a class="nav-link" data-target="tags" href="#tags">
            <span class="nav-icon">🏷️</span>
            <span class="nav-text">标签</span>
        </a></li>
        <li><a class="nav-link" data-target="file-groups" href="#file-groups">
            <span class="nav-icon">🔗</span>
            <span class="nav-text">文件组</span>
        </a></li>
        <li><a class="nav-link" data-target="group-tags" href="#group-tags">
            <span class="nav-icon">🔖</span>
            <span class="nav-text">组标签</span>
        </a></li>
        <li><a class="nav-link" data-target="group-relations" href="#group-relations">
            <span class="nav-icon">🔄</span>
            <span class="nav-text">组关系</span>
        </a></li>
    </ul>
</nav>

<!-- 消息提示容器 -->
<div id="message-container"></div>

<div id="modal-placeholder"></div>

<!-- 引入分离后的JavaScript文件 -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/fileManager.js"></script>
<script src="js/groupManager.js"></script>
<script src="js/tagManager.js"></script>
<script src="js/fileGroupManager.js"></script>
<script src="js/groupTagManager.js"></script>
<script src="js/groupRelationManager.js"></script>
<script src="js/main.js"></script>
<script src="js/loader.js"></script>
</body>
</html>
