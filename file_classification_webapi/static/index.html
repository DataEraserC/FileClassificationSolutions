<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件分类系统</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>文件分类系统</h1>
        </header>

        <div class="main-container">
            <!-- 侧边栏 -->
            <aside class="sidebar">
                <nav>
                    <ul>
                        <li><a href="#files" class="nav-link">文件管理</a></li>
                        <li><a href="#groups" class="nav-link">组管理</a></li>
                        <li><a href="#tags" class="nav-link">标签管理</a></li>
                        <li><a href="#file-groups" class="nav-link">文件组关联</a></li>
                        <li><a href="#group-tags" class="nav-link">组标签关联</a></li>
                        <li><a href="#group-relations" class="nav-link">组关系管理</a></li>
                    </ul>
                </nav>
            </aside>

            <!-- 主内容区 -->
            <main class="content">
                <!-- 文件管理 -->
                <section id="files" class="tab-content">
                    <h2>文件管理</h2>
                    <div class="form-container">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="file-id">文件ID:</label>
                                <input type="number" id="file-id" placeholder="请输入文件ID">
                            </div>
                            <div class="form-group">
                                <label for="file-name">文件名:</label>
                                <input type="text" id="file-name" placeholder="请输入文件名">
                            </div>
                            <div class="form-group">
                                <label for="file-path">文件路径:</label>
                                <input type="text" id="file-path" placeholder="请输入文件路径">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="file-group-id">组ID:</label>
                                <input type="number" id="file-group-id" placeholder="请输入组ID">
                            </div>
                            <div class="form-group">
                                <button onclick="listFilesByFilter()">查询文件</button>
                                <button onclick="getFileById()">根据ID获取文件</button>
                                <button onclick="listFilesByGroupId()">根据组ID获取文件</button>
                                <button onclick="createFile()">创建文件</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-container">
                        <h3>批量操作</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="file-conditions">查询条件 (JSON):</label>
                                <textarea id="file-conditions" rows="3" placeholder='[{"Id": 1}, {"Name": "example.txt"}]'></textarea>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="file-update-data">更新数据 (JSON):</label>
                                <textarea id="file-update-data" rows="3" placeholder='{"name": "new_name.txt", "path": "/new/path"}'></textarea>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <button onclick="listFilesByConditions()">条件查询</button>
                                <button onclick="updateFilesByConditions()">批量更新</button>
                                <button onclick="deleteFilesByConditions()">批量删除</button>
                            </div>
                        </div>
                    </div>
                    <div class="result-container">
                        <h3>查询结果</h3>
                        <div class="result" id="files-result"></div>
                    </div>
                </section>

                <!-- 组管理 -->
                <section id="groups" class="tab-content" style="display: none;">
                    <h2>组管理</h2>
                    <div class="form-container">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="group-id">组ID:</label>
                                <input type="number" id="group-id" placeholder="请输入组ID">
                            </div>
                            <div class="form-group">
                                <label for="group-name">组名:</label>
                                <input type="text" id="group-name" placeholder="请输入组名">
                            </div>
                            <div class="form-group">
                                <label for="group-description">组描述:</label>
                                <input type="text" id="group-description" placeholder="请输入组描述">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="group-file-id">文件ID:</label>
                                <input type="number" id="group-file-id" placeholder="请输入文件ID">
                            </div>
                            <div class="form-group">
                                <label for="group-tag-id">标签ID:</label>
                                <input type="number" id="group-tag-id" placeholder="请输入标签ID">
                            </div>
                            <div class="form-group">
                                <button onclick="listGroupsByFilter()">查询组</button>
                                <button onclick="getGroupById()">根据ID获取组</button>
                                <button onclick="listGroupsByFileId()">根据文件ID获取组</button>
                                <button onclick="listGroupsByTagId()">根据标签ID获取组</button>
                                <button onclick="createGroup()">创建组</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-container">
                        <h3>批量操作</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="group-conditions">查询条件 (JSON):</label>
                                <textarea id="group-conditions" rows="3" placeholder='[{"Id": 1}, {"Name": "example"}]'></textarea>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="group-update-data">更新数据 (JSON):</label>
                                <textarea id="group-update-data" rows="3" placeholder='{"name": "new_name", "description": "new description"}'></textarea>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <button onclick="listGroupsByConditions()">条件查询</button>
                                <button onclick="updateGroupsByConditions()">批量更新</button>
                                <button onclick="deleteGroupsByConditions()">批量删除</button>
                                <button onclick="getGroupTree()">获取组树</button>
                            </div>
                        </div>
                    </div>
                    <div class="result-container">
                        <h3>查询结果</h3>
                        <div class="result" id="groups-result"></div>
                    </div>
                </section>

                <!-- 标签管理 -->
                <section id="tags" class="tab-content" style="display: none;">
                    <h2>标签管理</h2>
                    <div class="form-container">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="tag-id">标签ID:</label>
                                <input type="number" id="tag-id" placeholder="请输入标签ID">
                            </div>
                            <div class="form-group">
                                <label for="tag-name">标签名:</label>
                                <input type="text" id="tag-name" placeholder="请输入标签名">
                            </div>
                            <div class="form-group">
                                <label for="tag-description">标签描述:</label>
                                <input type="text" id="tag-description" placeholder="请输入标签描述">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="tag-group-id">组ID:</label>
                                <input type="number" id="tag-group-id" placeholder="请输入组ID">
                            </div>
                            <div class="form-group">
                                <button onclick="listTagsByFilter()">查询标签</button>
                                <button onclick="getTagById()">根据ID获取标签</button>
                                <button onclick="listTagsByGroupId()">根据组ID获取标签</button>
                                <button onclick="createTag()">创建标签</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-container">
                        <h3>批量操作</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="tag-conditions">查询条件 (JSON):</label>
                                <textarea id="tag-conditions" rows="3" placeholder='[{"Id": 1}, {"Name": "example"}]'></textarea>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="tag-update-data">更新数据 (JSON):</label>
                                <textarea id="tag-update-data" rows="3" placeholder='{"name": "new_name", "description": "new description"}'></textarea>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <button onclick="listTagsByConditions()">条件查询</button>
                                <button onclick="updateTagsByConditions()">批量更新</button>
                                <button onclick="deleteTagsByConditions()">批量删除</button>
                            </div>
                        </div>
                    </div>
                    <div class="result-container">
                        <h3>查询结果</h3>
                        <div class="result" id="tags-result"></div>
                    </div>
                </section>

                <!-- 文件组关联 -->
                <section id="file-groups" class="tab-content" style="display: none;">
                    <h2>文件组关联</h2>
                    <div class="form-container">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="file-group-file-id">文件ID:</label>
                                <input type="number" id="file-group-file-id" placeholder="请输入文件ID">
                            </div>
                            <div class="form-group">
                                <label for="file-group-group-id">组ID:</label>
                                <input type="number" id="file-group-group-id" placeholder="请输入组ID">
                            </div>
                            <div class="form-group">
                                <button onclick="createFileGroup()">创建关联</button>
                                <button onclick="deleteFileGroup()">删除关联</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-container">
                        <h3>批量操作</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="file-group-conditions">查询条件 (JSON):</label>
                                <textarea id="file-group-conditions" rows="3" placeholder='[{"FileId": 1}, {"GroupId": 1}]'></textarea>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <button onclick="listFileGroupsByConditions()">条件查询</button>
                                <button onclick="deleteFileGroupsByConditions()">批量删除</button>
                            </div>
                        </div>
                    </div>
                    <div class="result-container">
                        <h3>查询结果</h3>
                        <div class="result" id="file-groups-result"></div>
                    </div>
                </section>

                <!-- 组标签关联 -->
                <section id="group-tags" class="tab-content" style="display: none;">
                    <h2>组标签关联</h2>
                    <div class="form-container">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="group-tag-group-id">组ID:</label>
                                <input type="number" id="group-tag-group-id" placeholder="请输入组ID">
                            </div>
                            <div class="form-group">
                                <label for="group-tag-tag-id">标签ID:</label>
                                <input type="number" id="group-tag-tag-id" placeholder="请输入标签ID">
                            </div>
                            <div class="form-group">
                                <button onclick="createGroupTag()">创建关联</button>
                                <button onclick="deleteGroupTag()">删除关联</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-container">
                        <h3>批量操作</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="group-tag-conditions">查询条件 (JSON):</label>
                                <textarea id="group-tag-conditions" rows="3" placeholder='[{"GroupId": 1}, {"TagId": 1}]'></textarea>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <button onclick="listGroupTagsByConditions()">条件查询</button>
                                <button onclick="deleteGroupTagsByConditions()">批量删除</button>
                            </div>
                        </div>
                    </div>
                    <div class="result-container">
                        <h3>查询结果</h3>
                        <div class="result" id="group-tags-result"></div>
                    </div>
                </section>

                <!-- 组关系管理 -->
                <section id="group-relations" class="tab-content" style="display: none;">
                    <h2>组关系管理</h2>
                    <div class="form-container">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="group-relation-first-id">第一组ID:</label>
                                <input type="number" id="group-relation-first-id" placeholder="请输入第一组ID">
                            </div>
                            <div class="form-group">
                                <label for="group-relation-second-id">第二组ID:</label>
                                <input type="number" id="group-relation-second-id" placeholder="请输入第二组ID">
                            </div>
                            <div class="form-group">
                                <label for="group-relation-type">关系类型:</label>
                                <input type="text" id="group-relation-type" placeholder="请输入关系类型">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <button onclick="createGroupRelation()">创建关系</button>
                                <button onclick="deleteGroupRelation()">删除关系</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-container">
                        <h3>批量操作</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="group-relation-conditions">查询条件 (JSON):</label>
                                <textarea id="group-relation-conditions" rows="3" placeholder='[{"FirstGroupId": 1}, {"SecondGroupId": 2}]'></textarea>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <button onclick="listGroupRelationsByConditions()">条件查询</button>
                                <button onclick="deleteGroupRelationsByConditions()">批量删除</button>
                            </div>
                        </div>
                    </div>
                    <div class="result-container">
                        <h3>查询结果</h3>
                        <div class="result" id="group-relations-result"></div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        // Tab切换功能
        document.addEventListener('DOMContentLoaded', function() {
            const navLinks = document.querySelectorAll('.nav-link');
            const tabContents = document.querySelectorAll('.tab-content');
            
            navLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    
                    // 隐藏所有tab内容
                    tabContents.forEach(content => {
                        content.style.display = 'none';
                    });
                    
                    // 移除所有链接的活动状态
                    navLinks.forEach(nav => {
                        nav.classList.remove('active');
                    });
                    
                    // 显示当前tab内容
                    const target = this.getAttribute('href');
                    document.querySelector(target).style.display = 'block';
                    
                    // 设置当前链接为活动状态
                    this.classList.add('active');
                });
            });
            
            // 默认显示第一个tab
            if (tabContents.length > 0) {
                tabContents[0].style.display = 'block';
                navLinks[0].classList.add('active');
            }
        });
    </script>
</body>
</html>
