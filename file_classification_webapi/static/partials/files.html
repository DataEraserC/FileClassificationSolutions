<!-- 文件管理 -->
<section class="tab-content" id="files">
    <h2>文件管理</h2>
    <!-- 简单搜索表单 -->
    <div class="search-form">
        <div class="form-row">
            <div class="form-group">
                <label for="file-id">文件ID:</label>
                <input id="file-id" placeholder="请输入文件ID" type="number">
            </div>
            <div class="form-group">
                <label for="file-type">文件类型:</label>
                <input id="file-type" placeholder="请输入文件类型" type="text">
            </div>
            <div class="form-group">
                <label for="file-path">文件路径:</label>
                <input id="file-path" placeholder="请输入文件路径" type="text">
            </div>
            <div class="form-group">
                <button onclick="listFilesByFilter()">搜索</button>
                <button onclick="resetFileFilter()">重置</button>
            </div>
        </div>
    </div>

    <div class="toolbar">
        <button onclick="openCreateFileDialog()">新增文件</button>
        <button onclick="deleteSelectedFiles()">批量删除</button>
        <button onclick="openComplexSearchFileDialog()">复杂查询</button>
    </div>
    <div class="table-container">
        <table id="files-table">
            <thead>
            <tr>
                <th><input id="files-select-all" onclick="toggleAllFiles(this)" type="checkbox"></th>
                <th>ID</th>
                <th>类型</th>
                <th>路径</th>
                <th>引用计数</th>
                <th>组ID</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <!-- 数据将通过JavaScript动态填充 -->
            </tbody>
        </table>
    </div>
    <!-- 分页控件 -->
    <div class="pagination-container" id="files-pagination">
        <!-- 分页控件将通过JavaScript动态填充 -->
    </div>
</section>
