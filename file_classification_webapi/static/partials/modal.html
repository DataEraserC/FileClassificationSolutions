<!-- 弹窗模态框 -->
<div class="modal" id="modal" onclick="if(event.target.id === 'modal') closeModal()">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modal-body">
            <!-- 弹窗内容将通过JavaScript动态填充 -->
        </div>
    </div>
</div>

<!-- 组树模态框 -->
<div class="modal" id="group-tree-modal" onclick="if(event.target.id === 'group-tree-modal') closeGroupTreeModal()">
    <div class="modal-content">
        <span class="close" onclick="closeGroupTreeModal()">&times;</span>
        <h2>组树状结构</h2>
        <div id="group-tree-container">
            <!-- 树状结构将通过JavaScript动态填充 -->
        </div>
    </div>
</div>
