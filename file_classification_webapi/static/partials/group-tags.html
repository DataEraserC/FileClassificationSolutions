<!-- 组标签关联管理 -->
<section class="tab-content" id="group-tags">
    <h2>组标签关联管理</h2>
    <!-- 简单搜索表单 -->
    <div class="search-form">
        <div class="form-row">
            <div class="form-group">
                <label for="group-tag-group-id">组ID:</label>
                <input id="group-tag-group-id" placeholder="请输入组ID" type="number">
            </div>
            <div class="form-group">
                <label for="group-tag-tag-id">标签ID:</label>
                <input id="group-tag-tag-id" placeholder="请输入标签ID" type="number">
            </div>
            <div class="form-group">
                <button onclick="listGroupTagsByFilter()">搜索</button>
                <button onclick="resetGroupTagFilter()">重置</button>
            </div>
        </div>
    </div>

    <div class="toolbar">
        <button onclick="openCreateGroupTagDialog()">新增关联</button>
        <button onclick="deleteSelectedGroupTags()">批量删除</button>
        <button onclick="openComplexSearchGroupTagDialog()">复杂查询</button>
    </div>
    <div class="table-container">
        <table id="group-tags-table">
            <thead>
            <tr>
                <th><input id="group-tags-select-all" onclick="toggleAllGroupTags(this)" type="checkbox"></th>
                <th>组ID</th>
                <th>标签ID</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <!-- 数据将通过JavaScript动态填充 -->
            </tbody>
        </table>
    </div>
    <!-- 分页控件 -->
    <div class="pagination-container" id="group-tags-pagination">
        <!-- 分页控件将通过JavaScript动态填充 -->
    </div>
</section>
