<!-- 文件组关联管理 -->
<section class="tab-content" id="file-groups">
    <h2>文件组关联管理</h2>
    <!-- 简单搜索表单 -->
    <div class="search-form">
        <div class="form-row">
            <div class="form-group">
                <label for="file-group-file-id">文件ID:</label>
                <input id="file-group-file-id" placeholder="请输入文件ID" type="number">
            </div>
            <div class="form-group">
                <label for="file-group-group-id">组ID:</label>
                <input id="file-group-group-id" placeholder="请输入组ID" type="number">
            </div>
            <div class="form-group">
                <button onclick="listFileGroupsByFilter()">搜索</button>
                <button onclick="resetFileGroupFilter()">重置</button>
            </div>
        </div>
    </div>

    <div class="toolbar">
        <button onclick="openCreateFileGroupDialog()">新增关联</button>
        <button onclick="deleteSelectedFileGroups()">批量删除</button>
        <button onclick="openComplexSearchFileGroupDialog()">复杂查询</button>
    </div>
    <div class="table-container">
        <table id="file-groups-table">
            <thead>
            <tr>
                <th><input id="file-groups-select-all" onclick="toggleAllFileGroups(this)" type="checkbox"></th>
                <th>文件ID</th>
                <th>组ID</th>
                <th>关联类型</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <!-- 数据将通过JavaScript动态填充 -->
            </tbody>
        </table>
    </div>
    <!-- 分页控件 -->
    <div class="pagination-container" id="file-groups-pagination">
        <!-- 分页控件将通过JavaScript动态填充 -->
    </div>
</section>
