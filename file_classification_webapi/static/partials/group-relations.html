<!-- 组关系管理 -->
<section class="tab-content" id="group-relations">
    <h2>组关系管理</h2>
    <!-- 简单搜索表单 -->
    <div class="search-form">
        <div class="form-row">
            <div class="form-group">
                <label for="group-relation-first-id">第一个组ID:</label>
                <input id="group-relation-first-id" placeholder="请输入第一个组ID" type="number">
            </div>
            <div class="form-group">
                <label for="group-relation-second-id">第二个组ID:</label>
                <input id="group-relation-second-id" placeholder="请输入第二个组ID" type="number">
            </div>
            <div class="form-group">
                <label for="group-relation-type">关系类型:</label>
                <input id="group-relation-type" placeholder="请输入关系类型" type="number">
            </div>
            <div class="form-group">
                <button onclick="listGroupRelationsByFilter()">搜索</button>
                <button onclick="resetGroupRelationFilter()">重置</button>
            </div>
        </div>
    </div>

    <div class="toolbar">
        <button onclick="openCreateGroupRelationDialog()">新增关系</button>
        <button onclick="deleteSelectedGroupRelations()">批量删除</button>
        <button onclick="openComplexSearchGroupRelationDialog()">复杂查询</button>
    </div>
    <div class="table-container">
        <table id="group-relations-table">
            <thead>
            <tr>
                <th><input id="group-relations-select-all" onclick="toggleAllGroupRelations(this)" type="checkbox"></th>
                <th>第一个组ID</th>
                <th>第二个组ID</th>
                <th>关系类型</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <!-- 数据将通过JavaScript动态填充 -->
            </tbody>
        </table>
    </div>
    <!-- 分页控件 -->
    <div class="pagination-container" id="group-relations-pagination">
        <!-- 分页控件将通过JavaScript动态填充 -->
    </div>
</section>
