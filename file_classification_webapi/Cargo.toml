[package]
name = "file_classification_webapi"
version = "0.2.0"
edition = "2024"

[dependencies]
file_classification_common = { path = "../common" }
file_classification_core = { path = "../file_classification_core", features = ["swagger"] }
chrono = { workspace = true }
serde = { workspace = true }
#diesel = { workspace = true, features = ["r2d2"] }
diesel = { workspace = true }
# web related deps
actix-web = "4.11"
actix-cors = "0.7"
lazy_static = "1.5"
serde_json = "1.0"
once_cell = "1.21"
env_logger = "0.11"
log = "0.4"
utoipa = { workspace = true, features = ["actix_extras"] }
utoipa-swagger-ui = { workspace = true, features = ["actix-web"] }
actix-files = "0.6.8"
rust-embed = "8.8.0"
mime_guess = "2.0.5"
fern = "0.6"
dotenvy = "0.15"

[[bin]]
name = "file_classification_webapi"
doc = false